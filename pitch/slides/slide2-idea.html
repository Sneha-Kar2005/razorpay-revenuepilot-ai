<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0e17; --surface:#10151f; --border:#232b3a; --text:#e7ebf3; --muted:#94a1b8; --accent:#6366f1; --accent2:#818cf8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1920px;height:1080px;background:var(--bg);font-family:'Inter',sans-serif;overflow:hidden; }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background-image: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.20), transparent 55%);
  }
  .mark { width:150px; height:150px; border-radius:34px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:64px; margin-bottom:48px;
    box-shadow: 0 30px 80px rgba(99,102,241,0.35); }
  h1 { font-size:104px; font-weight:800; color:var(--text); letter-spacing:-2px; }
  .tagline { font-size:34px; color:var(--muted); margin-top:28px; max-width:1300px; line-height:1.5; font-weight:500; }
  .pills { display:flex; gap:20px; margin-top:56px; }
  .pill { border:1px solid var(--border); background:var(--surface); color:var(--accent2); padding:16px 32px; border-radius:999px; font-size:20px; font-weight:600; }
</style>
</head>
<body>
  <div class="mark">RP</div>
  <h1>RevenuePilot AI</h1>
  <div class="tagline">A bounded, auditable revenue-recovery agent for Razorpay merchants &mdash;<br/>it detects money at risk, diagnoses why, acts safely, and proves what it recovered.</div>
  <div class="pills">
    <div class="pill">Detect</div>
    <div class="pill">Diagnose</div>
    <div class="pill">Decide</div>
    <div class="pill">Act</div>
    <div class="pill">Verify</div>
  </div>
</body>
</html>
